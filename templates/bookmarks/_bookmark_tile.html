<a href="{{ bookmark.url }}" target="_blank" rel="noopener noreferrer" class="flex flex-col items-center gap-2" title="{{ bookmark.title }}">
    <span class="relative aspect-square w-full max-w-[4.75rem] overflow-hidden rounded-ios shadow-sm sm:max-w-[5.5rem]"
          style="background-color: {{ bookmark.tile_color }}">
        {% if bookmark.icon_url %}
            <img src="{{ bookmark.icon_url }}" alt="" class="absolute inset-0 h-full w-full object-cover"
                onerror="this.classList.add('hidden'); this.nextElementSibling.classList.remove('hidden');">
            <span class="hidden absolute inset-0 flex items-center justify-center text-lg font-semibold text-slate-700">{{ bookmark.title.0 }}</span>
        {% else %}
            <span class="absolute inset-0 flex items-center justify-center text-lg font-semibold text-slate-700">{{ bookmark.title.0 }}</span>
        {% endif %}
    </span>
    <span class="w-full truncate text-center text-xs text-white/90">{{ bookmark.title }}</span>
</a>
