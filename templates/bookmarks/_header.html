{% with url_name=request.resolver_match.url_name %}
<header class="mb-8 flex items-center justify-between gap-3">
    <nav class="flex min-w-0 items-center overflow-x-auto rounded-full bg-white/10 p-1" aria-label="Sections">
        <a href="{% url 'home' %}"
           class="shrink-0 rounded-full px-3 py-1.5 text-sm font-medium {% if url_name == 'home' or url_name == 'folder' %}bg-white text-slate-900 shadow-sm{% else %}text-white/80 hover:bg-white/10 hover:text-white{% endif %}">Home</a>
        <a href="{% url 'export' %}"
           class="shrink-0 rounded-full px-3 py-1.5 text-sm font-medium text-white/80 hover:bg-white/10 hover:text-white">Export</a>
        <a href="{% url 'folders' %}"
           class="shrink-0 rounded-full px-3 py-1.5 text-sm font-medium {% if url_name == 'folders' or url_name == 'add_folder' or url_name == 'edit_folder' %}bg-white text-slate-900 shadow-sm{% else %}text-white/80 hover:bg-white/10 hover:text-white{% endif %}">Folder</a>
        <a href="{% url 'manage' %}"
           class="shrink-0 rounded-full px-3 py-1.5 text-sm font-medium {% if url_name == 'manage' %}bg-white text-slate-900 shadow-sm{% else %}text-white/80 hover:bg-white/10 hover:text-white{% endif %}">Manage</a>
    </nav>
    <div class="flex flex-shrink-0 items-center gap-2 sm:gap-3">
        <a href="{% url 'add_bookmark' %}{% if open_folder %}?folder={{ open_folder.pk }}{% endif %}" class="flex h-9 w-9 items-center justify-center rounded-full bg-white text-xl font-medium leading-none text-slate-900" aria-label="Add bookmark">+</a>
        <details class="relative">
            <summary class="cursor-pointer list-none rounded-full bg-white/15 px-3 py-1.5 text-sm font-medium backdrop-blur hover:bg-white/25">
                {{ request.user.username }}
            </summary>
            <div class="absolute right-0 z-30 mt-2 w-44 rounded-2xl bg-slate-900/95 p-2 shadow-lg ring-1 ring-white/10">
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="w-full rounded-xl px-3 py-2 text-left text-sm text-white/90 hover:bg-white/10">Logout</button>
                </form>
                <form method="post" action="{% url 'delete_account' %}"
                    onsubmit="return confirm('Delete your account?') && confirm('All bookmarks and folders will be removed.') && confirm('Last chance. Delete everything?');">
                    {% csrf_token %}
                    <button type="submit" class="w-full rounded-xl px-3 py-2 text-left text-sm text-rose-200 hover:bg-white/10">Delete account</button>
                </form>
            </div>
        </details>
    </div>
</header>
{% endwith %}
