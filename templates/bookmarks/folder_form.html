{% extends "base.html" %}

{% block title %}{% if folder %}Edit folder{% else %}New folder{% endif %} · iMarks{% endblock %}

{% block content %}
<div class="mx-auto flex min-h-screen max-w-md flex-col px-4 py-6">
    <header class="mb-8 flex items-center justify-between">
        <h1 class="text-xl font-semibold">{% if folder %}Edit folder{% else %}New folder{% endif %}</h1>
        <a href="{% if folder %}{% url 'manage' %}{% else %}{% url 'home' %}{% endif %}" class="text-sm text-white/80 hover:text-white">Cancel</a>
    </header>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <label class="block text-sm text-white/80">
            Name
            {{ form.name }}
            {{ form.name.errors }}
        </label>
        <label class="block text-sm text-white/80">
            Color
            {{ form.color }}
            {{ form.color.errors }}
        </label>
        <button type="submit" class="w-full rounded-2xl bg-white py-3 font-semibold text-slate-900">Save</button>
        {% if folder %}
            <button type="submit" name="delete" value="1" class="w-full rounded-2xl bg-white/10 py-3 font-semibold text-rose-200"
                onclick="return confirm('Delete this folder? Bookmarks inside it stay, unfiled.')">Delete</button>
        {% endif %}
    </form>
</div>
{% endblock %}
