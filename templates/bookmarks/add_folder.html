{% extends "base.html" %}

{% block title %}New folder · iMarks{% endblock %}

{% block content %}
<div class="mx-auto flex min-h-screen max-w-md flex-col px-4 py-6">
    <header class="mb-8 flex items-center justify-between">
        <h1 class="text-xl font-semibold">New folder</h1>
        <a href="{% url 'home' %}" class="text-sm text-white/80 hover:text-white">Cancel</a>
    </header>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <label class="block text-sm text-white/80">
            Name
            {{ form.name }}
            {{ form.name.errors }}
        </label>
        <p class="text-sm text-white/60">A pastel color is assigned automatically and used as the bookmark tile background.</p>
        <button type="submit" class="w-full rounded-2xl bg-white py-3 font-semibold text-slate-900">Create</button>
    </form>
</div>
{% endblock %}
